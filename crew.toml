name = "Tito"

[services.api]
repo = "tito"
cwd = "."
command = "bun run dev:api"
ready = { log = "Tito API ready", timeout_ms = 60000 }

[services.web]
repo = "tito"
cwd = "."
command = "bun run dev:web"
depends_on = ["api"]

[services.emails]
repo = "tito"
cwd = "."
command = "bun run dev:emails"
